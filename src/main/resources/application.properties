spring.application.name=movie-booking-system

server.port=${SERVER_PORT:9080}
spring.profiles.default=postgres

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.jackson.deserialization.fail-on-unknown-properties=true

spring.sql.init.mode=never

springdoc.paths-to-match=/api/payments/**
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=false

# SLF4J/Logback is supplied by the Spring Boot starters.
logging.level.root=INFO
logging.level.com.moviebooking=${APP_LOG_LEVEL:INFO}
logging.file.name=${LOG_FILE:logs/movie-booking-system.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
logging.pattern.level=%5p [requestId=%X{requestId:-none}]

services:
  - type: web
    name: payment-entity
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JAVA_TOOL_OPTIONS
        value: -Xms64m -Xmx256m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=48m -Xss512k
      - key: DB_HOST
        fromDatabase:
          name: payment-entity-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: payment-entity-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: payment-entity-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: payment-entity-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: payment-entity-db
          property: password

databases:
  - name: payment-entity-db
    plan: free
    region: singapore
    databaseName: payment_entity_db
    user: payment_entity
    ipAllowList: []
